# Built viewer bundles are generated output, not hand-edited source.
exclude: ^strix/interface/viewer/static/assets/

repos:
  # Ruff for fast linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        name: ruff-lint
      # Text file IO states its encoding: the locale default is the ANSI code page on
      # Windows. PLW1514 is a preview rule, so it runs on its own here.
      - id: ruff
        name: ruff-encoding
        args: [--preview, --select, PLW1514, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff-format

  # MyPy for static type checking. Runs the project's own mypy from the uv
  # environment (`make dev-install`) so it sees the same dependencies and
  # stubs as `make check-all`.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        files: ^(strix|tests)/
        require_serial: true

  # Built-in hooks for basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: debug-statements
      - id: check-case-conflict
      - id: check-docstring-first

  # Security checks with bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
