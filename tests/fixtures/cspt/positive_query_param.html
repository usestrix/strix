<!DOCTYPE html>
<!--
  CSPT fixture - positive: the unguarded source-to-sink primitive is present
  (impact is proven separately, per the client_side_path_traversal skill).
  Source: URL query parameter (location.search). Sink: fetch() request path.
  The attacker-controlled value flows unmodified into the fetch path, so a
  value like ../../admin/keys redirects the victim's authenticated request.
-->
<html>
  <head><meta charset="utf-8" /><title>Document viewer</title></head>
  <body>
    <main id="doc"></main>
    <script>
      const userPath = new URLSearchParams(location.search).get('doc') || '';
      fetch('/api/documents/' + userPath)
        .then((r) => r.text())
        .then((html) => { document.getElementById('doc').textContent = html; });
    </script>
  </body>
</html>
