<!DOCTYPE html>
<!--

  The request path is hardcoded; the user-controlled query value is only shown
  in the page text and never reaches the fetch path.

<html>
  <head><meta charset="utf-8" /><title>Profile</title></head>
  <body>
    <h1 id="greeting"></h1>
    <pre id="profile"></pre>
    <script>
      const name = new URLSearchParams(location.search).get('name') || 'guest';
      document.getElementById('greeting').textContent = 'Hello ' + name;
      fetch('/api/profile')
        .then((r) => r.json())
        .then((data) => { document.getElementById('profile').textContent = JSON.stringify(data); });
    </script>
  </body>
</html>
