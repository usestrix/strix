<!DOCTYPE html>
<!--
  CSPT fixture - Expected classification: negative (validated).
  The query value is checked against a numeric allowlist regex before it is
  used, so traversal sequences never reach the fetch path. This is a true
  negative control: the source does reach the sink, but guarded.
-->
<html>
  <head><meta charset="utf-8" /><title>Item</title></head>
  <body>
    <pre id="item"></pre>
    <script>
      const raw = new URLSearchParams(location.search).get('id') || '';
      const userPath = /^[0-9]+$/.test(raw) ? raw : '0';
      fetch('/api/items/' + userPath)
        .then((r) => r.json())
        .then((data) => { document.getElementById('item').textContent = JSON.stringify(data); });
    </script>
  </body>
</html>
