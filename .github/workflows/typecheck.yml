name: Type check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mypy:
    # `--platform` is what selects the branches mypy resolves, so all three run
    # on Linux. Checking out on three runner OSes would cost three times as much
    # and still check whatever platform each runner happened to be.
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux
          - darwin
          - win32

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2

      - name: Install dependencies
        run: uv sync --frozen

      - name: mypy --platform ${{ matrix.platform }}
        run: uv run mypy --platform ${{ matrix.platform }} strix/
